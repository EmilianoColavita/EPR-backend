


spring.application.name=backend

# Datasource (MySQL local por defecto, sobreescribible con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:epr_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
epr.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-por-uno-largo-y-aleatorio-1234567890}
epr.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seed inicial de administrador
epr.admin.email=${ADMIN_EMAIL:admin@epr.com}
epr.admin.password=${ADMIN_PASSWORD:admin1234}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Carga de archivos (evaluaciones en PDF)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
