spring.application.name=backend

# Configuración base (desarrollo local). En producción se activa además el perfil "prod"
# (SPRING_PROFILES_ACTIVE=prod, ya seteado en el Dockerfile), que sobreescribe lo necesario
# en application-prod.properties y exige que los secretos vengan por variables de entorno.

# Datasource (MySQL local por defecto, sobreescribible con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:epr_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
epr.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-por-uno-largo-y-aleatorio-1234567890}
epr.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Seed inicial de administrador
epr.admin.email=${ADMIN_EMAIL:admin@epr.com}
epr.admin.password=${ADMIN_PASSWORD:admin1234}

# Swagger / OpenAPI (se deshabilita en el perfil prod)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Carga de archivos. El request admite un poco más que el archivo por el overhead del multipart.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Email (SMTP). Configurar con variables de entorno en cada ambiente.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin timeouts, un SMTP que no responde deja colgado el hilo que envía el mail.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
epr.mail.from=${MAIL_FROM:no-reply@epr.com}

# URL pública del frontend (links de los mails) y orígenes permitidos por CORS (separados por coma)
epr.frontend.url=${FRONTEND_URL:http://localhost:3000}
epr.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${epr.frontend.url}}

# Restablecimiento de contraseña
epr.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
epr.password-reset.rate-limit.window-minutes=${PASSWORD_RESET_RATE_WINDOW_MINUTES:60}
epr.password-reset.rate-limit.max-per-ip=${PASSWORD_RESET_RATE_MAX_PER_IP:10}
epr.password-reset.rate-limit.max-per-email=${PASSWORD_RESET_RATE_MAX_PER_EMAIL:3}

# Rate limiting de endpoints públicos / sensibles (ventanas en minutos)
# Login: por IP cuenta todos los intentos; por email solo se reinicia al loguearse bien.
# El límite por IP es holgado porque en el gimnasio muchos alumnos comparten la misma IP (wifi).
epr.rate-limit.login.window-minutes=15
epr.rate-limit.login.max-per-ip=30
epr.rate-limit.login.max-per-email=5
epr.rate-limit.register.window-minutes=60
epr.rate-limit.register.max-per-ip=10
epr.rate-limit.solicitud-evaluacion.window-minutes=60
epr.rate-limit.solicitud-evaluacion.max-per-ip=5
epr.rate-limit.solicitud-evaluacion.max-per-email=2
epr.rate-limit.comprobantes.window-minutes=60
epr.rate-limit.comprobantes.max-per-usuario=10
