# Perfil de producción. Se activa con SPRING_PROFILES_ACTIVE=prod (el Dockerfile ya lo setea).
# Las variables sin valor por defecto son OBLIGATORIAS: si falta alguna, la app no arranca
# (es preferible a arrancar con un secreto o una contraseña de admin conocidos).

# Datasource: sin defaults. Dentro de la red interna de Docker no hace falta SSL hacia MySQL,
# siempre que el puerto de MySQL NO se exponga a internet.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JWT: secreto obligatorio (mínimo 32 caracteres, se valida al arrancar). Expiración por defecto: 7 días.
epr.jwt.secret=${JWT_SECRET}
epr.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Admin inicial: solo se usa si la tabla de usuarios está vacía (AdminSeeder exige que estén
# definidas en ese caso). Una vez creado el admin se pueden quitar del entorno.
epr.admin.email=${ADMIN_EMAIL:}
epr.admin.password=${ADMIN_PASSWORD:}

# URL pública del frontend, obligatoria (links de los mails y CORS)
epr.frontend.url=${FRONTEND_URL}

# Swagger deshabilitado: no exponer el mapa de la API en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Detrás del proxy de Dokploy (Traefik): usar X-Forwarded-For / X-Forwarded-Proto para obtener
# la IP real del cliente (rate limiting) y el esquema https.
server.forward-headers-strategy=native

# Nunca devolver detalles internos en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Cierre ordenado al redeployar: termina los requests en curso antes de apagar
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Compresión de respuestas JSON
server.compression.enabled=true
server.compression.mime-types=application/json
